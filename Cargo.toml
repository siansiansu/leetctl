[[bin]]
name = "leetctl"
path = "src/bin/leetctl.rs"

[package]
name = "leetctl"
version = "0.1.0"
authors = ["Bîn-hiân <minsiansu@gmail.com>"]
edition = "2024"
description = "LeetCode command-line interface in Rust, with curated problem sets and filtered random picking."
repository = "https://github.com/siansiansu/leetcode-rs"
license = "MIT"
documentation = "https://docs.rs/leetctl"
homepage = "https://github.com/siansiansu/leetcode-rs"
keywords = ["cli", "leetcode", "interview", "neetcode"]
categories = ["command-line-utilities"]
readme = './README.md'

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6", features = ["cargo", "derive"] }
colored = "3.1.1"
dirs = "6.0.0"
env_logger = "0.11.6"
log = "0.4.31"
pyo3 = { version = "0.29", optional = true }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
regex = "1.12.3"
scraper = "0.27.0"
anyhow = "1.0.102"
clap_complete = "4.6"
thiserror = "2.0.18"
unicode-width = "0.2"
notify = "8.2.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[dependencies.diesel]
version = "2.3.9"
features = ["sqlite"]

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["gzip", "json", "native-tls"]

[features]
pym = ["pyo3"]

[target.'cfg(target_family = "unix")'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }
