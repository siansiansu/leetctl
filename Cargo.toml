[[bin]]
name = "leetctl"
path = "src/bin/leetctl.rs"

[package]
name = "leetctl"
version = "0.3.1"
authors = ["Bîn-hiân <minsiansu@gmail.com>"]
edition = "2024"
description = "LeetCode command-line interface in Rust, with curated problem sets and filtered random picking."
repository = "https://github.com/siansiansu/leetctl"
license = "MIT"
documentation = "https://docs.rs/leetctl"
homepage = "https://github.com/siansiansu/leetctl"
keywords = ["cli", "leetcode", "interview", "neetcode"]
categories = ["command-line-utilities"]
readme = './README.md'

[dependencies]
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.6", features = ["cargo", "derive"] }
colored = "3.1.1"
crossterm = "0.29"
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
pyo3 = { version = "0.29.2", optional = true }
rand = "0.10.2"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
regex = "1.13.1"
scraper = "0.27.0"
anyhow = "1.0.104"
clap_complete = "4.6.9"
thiserror = "2.0.20"
unicode-width = "0.2"
notify = "8.2.0"
aes = "0.9.2"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# Statically link SQLite so a prebuilt binary does not depend on the host's
# libsqlite3, whose version varies across Linux distributions.
[dependencies.libsqlite3-sys]
version = "0.38.2"
features = ["bundled"]

[dependencies.diesel]
version = "2.3.12"
features = ["sqlite"]

# LeetCode fronts the judge endpoints with Cloudflare, which challenges a request whose TLS
# and HTTP/2 fingerprint does not belong to a real browser. `wreq` is reqwest's API over a
# stack that can reproduce Chrome's; `wreq-util` carries the profiles. Verified by hand:
# reqwest was challenged where curl, with byte-identical headers and cookies, was not.
[dependencies.wreq]
version = "6.0.0-rc.31"
features = ["gzip", "json"]

[dependencies.wreq-util]
version = "3.0.0-rc.14"

[features]
pym = ["pyo3"]

[target.'cfg(target_family = "unix")'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

# The profile dist builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
